<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zain Saloon — Salon Management &amp; Billing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#14110F',
          surface: '#1C1712',
          surface2: '#252017',
          surface3: '#2E2820',
          edge: '#3A3128',
          edge2: '#4A3F30',
          gold: { DEFAULT: '#C79A3E', light: '#E3C069', dark: '#9C7A2E' },
          cream: '#F3ECDE',
          muted: '#A99C87',
          success: '#4C9A6A',
          danger: '#C1584F',
          info: '#5A8FBE'
        },
        fontFamily: {
          display: ['"Fraunces"', 'serif'],
          sans: ['"Inter"', 'ui-sans-serif', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
  html, body { background:#14110F; }
  body { font-family:'Inter', sans-serif; }
  .font-display { font-family:'Fraunces', serif; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:#1C1712; }
  ::-webkit-scrollbar-thumb{ background:#3A3128; border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:#4A3F30; }
  .view { display:none; }
  .view.active { display:block; }
  .scale-in { animation: scaleIn .16s ease-out; }
  @keyframes scaleIn { from{opacity:0; transform:scale(.97) translateY(4px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .fade-in { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .toast-in { animation: toastIn .25s cubic-bezier(.2,.9,.3,1); }
  @keyframes toastIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, input[type=tel]:focus, input[type=email]:focus, input[type=date]:focus, select:focus, textarea:focus { outline:none; box-shadow:0 0 0 2px #C79A3E; border-color:#C79A3E; }
  .svc-card.selected { border-color:#C79A3E; background:#2E2820; }
  #printReceiptArea { display:none; }
  @media print {
    body * { visibility:hidden; }
    #printReceiptArea, #printReceiptArea * { visibility:visible; }
    #printReceiptArea { display:block !important; position:absolute; top:0; left:0; width:80mm; }
    @page { margin:6mm; }
  }
  .badge-dot::before{ content:''; display:inline-block; width:6px; height:6px; border-radius:9999px; margin-right:6px; }
</style>
</head>
<body class="bg-ink text-cream min-h-screen">

<!-- ============ LOGIN VIEW ============ -->
<div id="loginView" class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
  <div class="absolute inset-0 opacity-[0.06]" style="background-image: radial-gradient(circle at 1px 1px, #C79A3E 1px, transparent 0); background-size: 22px 22px;"></div>
  <div class="w-full max-w-sm relative">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full border border-gold/40 mb-4">
        <i data-lucide="scissors" class="w-6 h-6 text-gold"></i>
      </div>
      <h1 class="font-display text-4xl tracking-tight text-cream">Zain Saloon</h1>
      <p class="text-muted text-sm mt-2 tracking-wide">Salon Management &amp; Billing System</p>
    </div>
    <form id="loginForm" class="bg-surface border border-edge rounded-2xl p-7 shadow-2xl shadow-black/40">
      <div id="loginError" class="hidden mb-4 text-sm text-danger bg-danger/10 border border-danger/30 rounded-lg px-3 py-2"></div>
      <label class="block text-xs uppercase tracking-wider text-muted mb-1.5">Username</label>
      <input id="loginUsername" type="text" value="admin" class="w-full bg-surface2 border border-edge rounded-lg px-3.5 py-2.5 text-sm text-cream mb-4 placeholder:text-muted/60" placeholder="admin">
      <label class="block text-xs uppercase tracking-wider text-muted mb-1.5">Password</label>
      <input id="loginPassword" type="password" value="admin123" class="w-full bg-surface2 border border-edge rounded-lg px-3.5 py-2.5 text-sm text-cream mb-4 placeholder:text-muted/60" placeholder="••••••••">
      <label class="flex items-center gap-2 mb-6 cursor-pointer select-none">
        <input id="loginRemember" type="checkbox" class="w-4 h-4 rounded border-edge bg-surface2 accent-[#C79A3E]">
        <span class="text-sm text-muted">Remember me</span>
      </label>
      <button type="submit" class="w-full bg-gold hover:bg-gold-light text-ink font-semibold rounded-lg py-2.5 text-sm transition-colors">Login</button>
      <p class="text-center text-xs text-muted mt-5">Demo credentials — <span class="text-cream/80">admin / admin123</span></p>
    </form>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="hidden min-h-screen">
  <div class="flex">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed lg:static z-40 -translate-x-full lg:translate-x-0 transition-transform duration-200 w-64 h-screen bg-surface border-r border-edge flex flex-col">
      <div class="flex items-center gap-2.5 px-5 h-16 border-b border-edge shrink-0">
        <div class="w-8 h-8 rounded-full border border-gold/40 flex items-center justify-center shrink-0">
          <i data-lucide="scissors" class="w-4 h-4 text-gold"></i>
        </div>
        <div class="leading-tight">
          <p class="font-display text-lg text-cream">Zain Saloon</p>
          <p class="text-[10px] text-muted tracking-wide -mt-0.5">Billing System</p>
        </div>
        <button onclick="toggleSidebar(false)" class="ml-auto lg:hidden text-muted hover:text-cream"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3 space-y-1"></nav>
      <div class="p-3 border-t border-edge">
        <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-muted hover:text-cream hover:bg-surface2 transition-colors">
          <i data-lucide="log-out" class="w-4 h-4"></i> Logout
        </button>
      </div>
    </aside>
    <div id="sidebarOverlay" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black/60 z-30 lg:hidden"></div>

    <!-- MAIN -->
    <div class="flex-1 min-w-0 flex flex-col h-screen">
      <header class="h-16 shrink-0 border-b border-edge bg-surface/60 backdrop-blur flex items-center gap-3 px-4 lg:px-6">
        <button onclick="toggleSidebar(true)" class="lg:hidden text-muted hover:text-cream"><i data-lucide="menu" class="w-5 h-5"></i></button>
        <h2 id="pageTitle" class="font-display text-xl text-cream">Dashboard</h2>
        <div class="ml-auto flex items-center gap-4">
          <span id="headerDate" class="hidden sm:block text-xs text-muted"></span>
          <div class="flex items-center gap-2 pl-4 border-l border-edge">
            <div class="w-8 h-8 rounded-full bg-gold/20 border border-gold/40 flex items-center justify-center text-gold text-xs font-semibold">A</div>
            <span class="hidden sm:block text-sm text-cream">Admin</span>
          </div>
        </div>
      </header>
      <main id="mainContent" class="flex-1 overflow-y-auto p-4 lg:p-6"></main>
    </div>
  </div>
</div>

<!-- Modal root -->
<div id="modalRoot"></div>
<!-- Toast root -->
<div id="toastRoot" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2 items-end"></div>
<!-- Hidden print area -->
<div id="printReceiptArea"></div>

<script>
/* =========================================================
   ZAIN SALOON — Salon Management & Billing System (Demo SPA)
   ========================================================= */

/* ---------- Storage helpers ---------- */
const K = { customers:'zs_customers', services:'zs_services', invoices:'zs_invoices', settings:'zs_settings', seq:'zs_invoiceSeq', session:'zs_session' };
const DB = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } },
  set(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
};
const uid = (p='id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = n => 'PKR ' + Math.round(Number(n)||0).toLocaleString('en-PK');
const two = n => String(n).padStart(2,'0');
function fmtDate(d){ const dt = new Date(d); return two(dt.getDate())+' '+dt.toLocaleString('en-US',{month:'short'})+' '+dt.getFullYear(); }
function fmtTime(d){ const dt = new Date(d); let h=dt.getHours(), m=dt.getMinutes(); const ap = h>=12?'PM':'AM'; h = h%12||12; return two(h)+':'+two(m)+' '+ap; }
function isSameDay(a,b){ a=new Date(a); b=new Date(b); return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); d.setHours(9+Math.floor(Math.random()*8), Math.floor(Math.random()*60), 0, 0); return d.toISOString(); }

/* ---------- Demo data bootstrap ---------- */
function seedIfEmpty(){
  if(!localStorage.getItem(K.services)){
    DB.set(K.services, [
      {id:uid('s'), name:'Haircut', category:'Hair', price:700, duration:30, status:'Active'},
      {id:uid('s'), name:'Beard Trim', category:'Beard', price:400, duration:20, status:'Active'},
      {id:uid('s'), name:'Hair Styling', category:'Hair', price:800, duration:25, status:'Active'},
      {id:uid('s'), name:'Facial', category:'Facial', price:1500, duration:45, status:'Active'},
      {id:uid('s'), name:'Hair Color', category:'Hair Color', price:2500, duration:60, status:'Active'},
      {id:uid('s'), name:'Shaving', category:'Beard', price:300, duration:15, status:'Active'},
      {id:uid('s'), name:'Head Massage', category:'Massage', price:1000, duration:30, status:'Active'},
      {id:uid('s'), name:'Hair Wash', category:'Hair', price:500, duration:15, status:'Active'},
    ]);
  }
  if(!localStorage.getItem(K.customers)){
    DB.set(K.customers, [
      {id:uid('c'), name:'Ali Raza', phone:'0300-1111111', email:'', address:'Gulberg, Lahore', notes:''},
      {id:uid('c'), name:'Hamza Khan', phone:'0301-2222222', email:'hamza@example.com', address:'', notes:'Prefers evening slots'},
      {id:uid('c'), name:'Usman Ahmed', phone:'0302-3333333', email:'', address:'Johar Town, Lahore', notes:''},
      {id:uid('c'), name:'Bilal Shah', phone:'0303-4444444', email:'', address:'', notes:''},
      {id:uid('c'), name:'Ahmed Hassan', phone:'0304-5555555', email:'ahmed.h@example.com', address:'DHA, Lahore', notes:'Allergic to certain hair color brands'},
    ]);
  }
  if(!localStorage.getItem(K.settings)){
    DB.set(K.settings, {
      salonName:'Zain Saloon', phone:'0300-1234567', address:'Main Market, Lahore', currency:'PKR',
      taxPercent:0, defaultDiscount:0,
      showLogo:true, showPhone:true, showAddress:true, footerMessage:'Thank you for visiting Zain Saloon\nSee you again!'
    });
  }
  if(!localStorage.getItem(K.invoices)){
    const cust = DB.get(K.customers, []);
    const svc = DB.get(K.services, []);
    const byName = n => svc.find(s=>s.name===n);
    const mk = (num, cIdx, items, pay, daysBack, status='Paid') => {
      const c = cIdx===null ? {name:'Walk-in Customer', phone:'-'} : cust[cIdx];
      const its = items.map(([name,qty])=>{ const s=byName(name); return {id:s.id, name:s.name, price:s.price, qty}; });
      const subtotal = its.reduce((a,i)=>a+i.price*i.qty,0);
      const discountType='fixed', discountValue = daysBack===0 && num===1004 ? 200 : 0;
      const discountAmount = discountValue;
      const taxPercent=0, taxAmount=0;
      const total = Math.max(subtotal - discountAmount + taxAmount, 0);
      const dateISO = daysAgo(daysBack);
      const received = status==='Paid' ? total : 0;
      return {
        id: uid('inv'), invoiceNo:'INV-'+num, customerId: cIdx===null?null:c.id, customerName:c.name, customerPhone:c.phone,
        items: its, subtotal, discountType, discountValue, discountAmount, taxPercent, taxAmount, total,
        paymentMethod: pay, amountReceived: received, change: Math.max(received-total,0),
        status, dateISO
      };
    };
    const invoices = [
      mk(1001, 0, [['Haircut',1],['Beard Trim',1]], 'Cash', 0),
      mk(1002, 1, [['Facial',1]], 'Card', 0),
      mk(1003, 2, [['Haircut',1]], 'Cash', 0),
      mk(1004, 3, [['Hair Color',1],['Hair Wash',1]], 'Bank Transfer', 1),
      mk(1005, 4, [['Beard Trim',1],['Shaving',1]], 'Cash', 1),
      mk(1006, 0, [['Head Massage',1],['Haircut',1]], 'Card', 3),
      mk(1007, null, [['Haircut',1]], 'Cash', 5),
      mk(1008, 1, [['Facial',1],['Hair Styling',1]], 'Cash', 15, 'Pending'),
    ];
    // fix pending invoice received/change
    invoices[7].amountReceived = 0; invoices[7].change = 0;
    DB.set(K.invoices, invoices);
    DB.set(K.seq, 1009);
  }
  if(!localStorage.getItem(K.seq)) DB.set(K.seq, 1009);
}
seedIfEmpty();

/* ---------- Session / Auth ---------- */
let session = DB.get(K.session, null);

function doLogin(e){
  e.preventDefault();
  const u = document.getElementById('loginUsername').value.trim();
  const p = document.getElementById('loginPassword').value;
  const remember = document.getElementById('loginRemember').checked;
  const err = document.getElementById('loginError');
  if(u==='admin' && p==='admin123'){
    err.classList.add('hidden');
    session = {user:'Admin', remember, loggedInAt:Date.now()};
    DB.set(K.session, session);
    enterApp();
  } else {
    err.textContent = 'Invalid username or password. Try admin / admin123.';
    err.classList.remove('hidden');
  }
}
document.getElementById('loginForm').addEventListener('submit', doLogin);

function logout(){
  DB.set(K.session, null);
  session = null;
  document.getElementById('appShell').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
}

function enterApp(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  buildSidebar();
  updateHeaderDate();
  navigate('dashboard');
  lucide.createIcons();
}
if(session){ enterApp(); }

/* ---------- Sidebar / Nav ---------- */
const NAV_ITEMS = [
  {key:'dashboard', label:'Dashboard', icon:'layout-dashboard'},
  {key:'billing', label:'New Bill', icon:'receipt-text'},
  {key:'history', label:'Billing History', icon:'history'},
  {key:'customers', label:'Customers', icon:'users'},
  {key:'services', label:'Services', icon:'scissors'},
  {key:'reports', label:'Reports', icon:'bar-chart-3'},
  {key:'settings', label:'Settings', icon:'settings'},
];
let currentView = 'dashboard';

function buildSidebar(){
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = NAV_ITEMS.map(i => `
    <button data-nav="${i.key}" onclick="navigate('${i.key}')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors ${currentView===i.key ? 'bg-gold/15 text-gold border border-gold/30' : 'text-muted hover:text-cream hover:bg-surface2 border border-transparent'}">
      <i data-lucide="${i.icon}" class="w-4 h-4"></i> ${i.label}
    </button>`).join('');
}
function toggleSidebar(open){
  const sb = document.getElementById('sidebar'), ov = document.getElementById('sidebarOverlay');
  if(open){ sb.classList.remove('-translate-x-full'); ov.classList.remove('hidden'); }
  else { sb.classList.add('-translate-x-full'); ov.classList.add('hidden'); }
}
function updateHeaderDate(){
  const d = new Date();
  document.getElementById('headerDate').textContent = d.toLocaleDateString('en-US',{weekday:'long', year:'numeric', month:'long', day:'numeric'});
}

const TITLES = {dashboard:'Dashboard', billing:'New Bill', history:'Billing History', customers:'Customers', services:'Services', reports:'Reports', settings:'Settings'};

function navigate(view, params){
  currentView = view;
  document.getElementById('pageTitle').textContent = TITLES[view] || '';
  buildSidebar();
  toggleSidebar(false);
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  main.classList.remove('fade-in'); void main.offsetWidth; main.classList.add('fade-in');
  if(view==='dashboard') renderDashboard(main);
  else if(view==='billing') renderBilling(main, params);
  else if(view==='history') renderHistory(main);
  else if(view==='customers') renderCustomers(main);
  else if(view==='services') renderServices(main);
  else if(view==='reports') renderReports(main);
  else if(view==='settings') renderSettings(main);
  lucide.createIcons();
}

/* ---------- Toasts ---------- */
function showToast(msg, type='success'){
  const root = document.getElementById('toastRoot');
  const colors = { success:'border-success/40 text-success', danger:'border-danger/40 text-danger', info:'border-info/40 text-info' };
  const icons = { success:'check-circle-2', danger:'alert-circle', info:'info' };
  const t = document.createElement('div');
  t.className = `toast-in bg-surface2 border ${colors[type]} rounded-lg px-4 py-3 shadow-xl shadow-black/40 flex items-center gap-2 text-sm text-cream max-w-xs`;
  t.innerHTML = `<i data-lucide="${icons[type]}" class="w-4 h-4 shrink-0"></i><span>${msg}</span>`;
  root.appendChild(t);
  lucide.createIcons();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300); }, 2800);
}

/* ---------- Modal helper ---------- */
function openModal(innerHtml, maxw='max-w-lg'){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 fade-in" id="modalOverlay">
      <div class="scale-in bg-surface border border-edge rounded-2xl w-full ${maxw} max-h-[90vh] overflow-y-auto shadow-2xl">
        ${innerHtml}
      </div>
    </div>`;
  document.getElementById('modalOverlay').addEventListener('mousedown', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  lucide.createIcons();
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* =========================================================
   DASHBOARD
   ========================================================= */
function renderDashboard(main){
  const invoices = DB.get(K.invoices, []);
  const customers = DB.get(K.customers, []);
  const services = DB.get(K.services, []);
  const today = new Date();
  const todayInv = invoices.filter(i => isSameDay(i.dateISO, today));
  const todaySales = todayInv.filter(i=>i.status==='Paid').reduce((a,i)=>a+i.total,0);
  const todayCustomersSet = new Set(todayInv.map(i => i.customerPhone));
  const pendingAmt = invoices.filter(i=>i.status==='Pending').reduce((a,i)=>a+i.total,0);

  const recent = [...invoices].sort((a,b)=> new Date(b.dateISO)-new Date(a.dateISO)).slice(0,6);

  const svcCounts = {};
  invoices.forEach(inv => inv.items.forEach(it => { svcCounts[it.name] = (svcCounts[it.name]||0) + it.qty; }));
  const popular = Object.entries(svcCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxCount = popular.length ? popular[0][1] : 1;

  main.innerHTML = `
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <div>
        <h3 class="font-display text-2xl text-cream">${greeting()}, Admin</h3>
        <p class="text-muted text-sm mt-1">${today.toLocaleDateString('en-US',{weekday:'long', year:'numeric', month:'long', day:'numeric'})}</p>
      </div>
      <button onclick="navigate('billing')" class="inline-flex items-center gap-2 bg-gold hover:bg-gold-light text-ink font-semibold rounded-lg px-4 py-2.5 text-sm transition-colors shrink-0">
        <i data-lucide="plus" class="w-4 h-4"></i> New Bill
      </button>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard("Today's Sales", fmt(todaySales), 'wallet', 'gold')}
      ${statCard("Today's Customers", String(todayCustomersSet.size), 'users', 'info')}
      ${statCard("Today's Bills", String(todayInv.length), 'receipt', 'success')}
      ${statCard('Pending Payments', fmt(pendingAmt), 'clock', 'danger')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <div class="lg:col-span-2 bg-surface border border-edge rounded-2xl overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-edge">
          <h4 class="font-display text-lg text-cream">Recent Transactions</h4>
          <button onclick="navigate('history')" class="text-xs text-gold hover:text-gold-light">View all →</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-muted text-xs uppercase tracking-wide border-b border-edge">
                <th class="px-5 py-3 font-medium">Invoice</th>
                <th class="px-3 py-3 font-medium">Customer</th>
                <th class="px-3 py-3 font-medium hidden md:table-cell">Services</th>
                <th class="px-3 py-3 font-medium hidden sm:table-cell">Date</th>
                <th class="px-3 py-3 font-medium hidden lg:table-cell">Payment</th>
                <th class="px-3 py-3 font-medium">Amount</th>
                <th class="px-3 py-3 font-medium">Status</th>
                <th class="px-5 py-3 font-medium text-right">Action</th>
              </tr>
            </thead>
            <tbody>
              ${recent.map(inv => `
                <tr class="border-b border-edge/60 last:border-0 hover:bg-surface2/60">
                  <td class="px-5 py-3 font-medium text-cream whitespace-nowrap">${inv.invoiceNo}</td>
                  <td class="px-3 py-3 text-cream/90 whitespace-nowrap">${inv.customerName}</td>
                  <td class="px-3 py-3 text-muted hidden md:table-cell">${inv.items.map(i=>i.name).join(' + ')}</td>
                  <td class="px-3 py-3 text-muted hidden sm:table-cell whitespace-nowrap">${isSameDay(inv.dateISO,today)?'Today':fmtDate(inv.dateISO)}</td>
                  <td class="px-3 py-3 text-muted hidden lg:table-cell">${inv.paymentMethod}</td>
                  <td class="px-3 py-3 text-cream whitespace-nowrap">${fmt(inv.total)}</td>
                  <td class="px-3 py-3">${statusBadge(inv.status)}</td>
                  <td class="px-5 py-3 text-right"><button onclick="viewInvoice('${inv.id}')" class="text-gold hover:text-gold-light text-xs">View</button></td>
                </tr>`).join('') || `<tr><td colspan="8" class="px-5 py-8 text-center text-muted text-sm">No transactions yet</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="bg-surface border border-edge rounded-2xl p-5">

function billTotals(){
  const subtotal = bill.items.reduce((a,i)=>a+i.price*i.qty,0);
  let discountAmount = 0;
  if(bill.discountType==='percent') discountAmount = subtotal * (Number(bill.discountValue)||0) / 100;
  else discountAmount = Number(bill.discountValue)||0;
  discountAmount = Math.min(discountAmount, subtotal);
  const settings = DB.get(K.settings, {});
  const taxPercent = Number(settings.taxPercent)||0;
  const taxAmount = (subtotal - discountAmount) * taxPercent / 100;
  const total = Math.max(subtotal - discountAmount + taxAmount, 0);
  return {subtotal, discountAmount, taxPercent, taxAmount, total};
}
function billTotalsHtml(){
  const t = billTotals();
  return `
    <div class="space-y-1.5 pt-1 text-sm">
      <div class="flex justify-between text-muted"><span>Subtotal</span><span class="text-cream/90">${fmt(t.subtotal)}</span></div>
      <div class="flex justify-between text-muted"><span>Discount</span><span class="text-danger">- ${fmt(t.discountAmount)}</span></div>
      <div class="flex justify-between text-muted"><span>Tax (${t.taxPercent}%)</span><span class="text-cream/90">${fmt(t.taxAmount)}</span></div>
      <div class="flex justify-between pt-2 mt-1 border-t border-edge text-base"><span class="text-cream font-medium">Grand Total</span><span class="text-gold font-display font-semibold">${fmt(t.total)}</span></div>
    </div>`;
}

function onBillPhoneInput(val){

  if(match){

    document.getElementById('billCustName').value = match.name;
    hint.innerHTML = `<span class="text-success">✓ Existing customer found — ${match.name}</span>`;
  } else if(val.length>3){
    hint.innerHTML = `<span class="text-muted">No match found — will be saved as a new customer.</span>`;
  } else {
    hint.innerHTML = '';
  }
}
function setBillCategory(c){ bill.category = c; navigate('billing'); }
function addToBill(serviceId){
  const s = DB.get(K.services, []).find(x=>x.id===serviceId);
  if(!s) return;
  const existing = bill.items.find(i=>i.id===s.id);
  if(existing) existing.qty += 1;
  else bill.items.push({id:s.id, name:s.name, price:s.price, qty:1});
  showToast(`${s.name} added to bill`, 'success');
  navigate('billing');
}
function changeQty(idx, delta){
  const it = bill.items[idx]; if(!it) return;
  it.qty += delta;
  if(it.qty<=0) bill.items.splice(idx,1);
  navigate('billing');
}
function removeFromBill(idx){ bill.items.splice(idx,1); navigate('billing'); }
function setDiscountType(v){ bill.discountType = v; navigate('billing'); }
function setDiscountValue(v){ bill.discountValue = v; document.querySelector('#mainContent').querySelectorAll('.space-y-1\\.5')[0].outerHTML = billTotalsHtml(); updateChangeDisplay(); }

function completePayment(){
  if(bill.items.length===0){ showToast('Add at least one service to the bill', 'danger'); return; }
  const t = billTotals();
  const payMethod = bill.payMethod || 'Cash';
  const received = Number(bill.amountReceived)||0;
  if(payMethod==='Cash' && received < t.total){ showToast('Amount received is less than the grand total', 'danger'); return; }

  // ensure customer exists in DB (walk-in stays unsaved)
  let custId = bill.customer.id;
  if(!custId && bill.customer.name !== 'Walk-in Customer' && bill.customer.phone){
    const customers = DB.get(K.customers, []);
    const existing = customers.find(c=>c.phone===bill.customer.phone);
    if(existing){ custId = existing.id; }
    else {
      const c = {id:uid('c'), name:bill.customer.name, phone:bill.customer.phone, email:'', address:'', notes:''};
      customers.push(c); DB.set(K.customers, customers); custId = c.id;
    }
  }

  const seq = DB.get(K.seq, 1001);
  const invoice = {
    id: uid('inv'), invoiceNo: 'INV-'+seq,
    customerId: custId, customerName: bill.customer.name || 'Walk-in Customer', customerPhone: bill.customer.phone || '-',
    items: bill.items.map(i=>({...i})), subtotal: t.subtotal, discountType: bill.discountType, discountValue: Number(bill.discountValue)||0,
    discountAmount: t.discountAmount, taxPercent: t.taxPercent, taxAmount: t.taxAmount, total: t.total,
    paymentMethod: payMethod, amountReceived: payMethod==='Cash' ? received : t.total, change: payMethod==='Cash' ? Math.max(received-t.total,0) : 0,
    status: 'Paid', dateISO: new Date().toISOString()
  };
  const invoices = DB.get(K.invoices, []); invoices.push(invoice); DB.set(K.invoices, invoices);
  DB.set(K.seq, seq+1);

  showPaymentSuccess(invoice);
}

function generateReceiptHTML(invoice){
  const s = DB.get(K.settings, {});
  const lines = invoice.items.map(it => `
    <tr>
      <td style="padding:2px 0;">${escHtml(it.name)}</td>
      <td style="padding:2px 0; text-align:center;">${it.qty}x${it.price}</td>
      <td style="padding:2px 0; text-align:right;">${it.price*it.qty}</td>
    </tr>`).join('');
  return `

      <div style="text-align:center; margin-bottom:6px;">
        ${s.showLogo!==false ? '<div style="font-size:16px; font-weight:bold; letter-spacing:1px;">ZAIN SALOON</div>' : ''}
        <div style="font-size:10px;">Salon Management &amp; Billing System</div>
        ${s.showAddress!==false && s.address ? `<div style="font-size:10px;">${escHtml(s.address)}</div>` : ''}
        ${s.showPhone!==false && s.phone ? `<div style="font-size:10px;">${escHtml(s.phone)}</div>` : ''}
      </div>
      <div style="border-top:1px dashed #000; margin:6px 0;"></div>

      <div>Date: ${fmtDate(invoice.dateISO)} ${fmtTime(invoice.dateISO)}</div>

      ${s.showPhone!==false ? `<div>Phone: ${escHtml(invoice.customerPhone||'-')}</div>` : ''}

function printReceipt(invoiceId){
  const invoice = DB.get(K.invoices, []).find(i=>i.id===invoiceId);
  if(!invoice) return;
  document.getElementById('printReceiptArea').innerHTML = generateReceiptHTML(invoice);
  window.print();
}
function downloadReceipt(invoiceId){
  const invoice = DB.get(K.invoices, []).find(i=>i.id===invoiceId);
  if(!invoice) return;
  const s = DB.get(K.settings, {});
  const text = buildPlainReceipt(invoice, s);
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = invoice.invoiceNo + '.txt';
  a.click();
  showToast('Receipt downloaded', 'success');
}
function buildPlainReceipt(invoice, s){
  const line = '--------------------------------';
  let out = '';
  out += 'ZAIN SALOON\n';
  out += 'Salon Management & Billing System\n';
  out += line + '\n';
  out += `Invoice: ${invoice.invoiceNo}\n`;
  out += `Date: ${fmtDate(invoice.dateISO)} ${fmtTime(invoice.dateISO)}\n`;
  out += `Customer: ${invoice.customerName}\n`;
  out += `Phone: ${invoice.customerPhone||'-'}\n`;
  out += line + '\n';
  invoice.items.forEach(it => { out += `${it.name.padEnd(16)} ${String(it.qty+'x'+it.price).padEnd(9)} ${String(it.price*it.qty).padStart(6)}\n`; });
  out += line + '\n';
  out += `Subtotal`.padEnd(24) + String(Math.round(invoice.subtotal)).padStart(8) + '\n';
  out += `Discount`.padEnd(24) + String(Math.round(invoice.discountAmount)).padStart(8) + '\n';
  out += `Tax`.padEnd(24) + String(Math.round(invoice.taxAmount)).padStart(8) + '\n';
  out += `TOTAL`.padEnd(24) + String(Math.round(invoice.total)).padStart(8) + '\n';
  out += line + '\n';
  out += `Payment: ${invoice.paymentMethod.toUpperCase()}\n`;
  if(invoice.paymentMethod==='Cash'){ out += `Received: ${Math.round(invoice.amountReceived)}\nChange: ${Math.round(invoice.change)}\n`; }
  out += line + '\n';
  out += (s.footerMessage || 'Thank you for visiting Zain Saloon\nSee you again!') + '\n';
  return out;
}

let historyFilters = { q:'', range:'all', from:'', to:'' };
function renderHistory(main){
  main.innerHTML = `

          <input id="histSearch" oninput="setHistoryFilter('q', this.value)" value="${escAttr(historyFilters.q)}" type="text" placeholder="Search invoice no., customer name, or phone…" class="w-full bg-surface2 border border-edge rounded-lg pl-9 pr-3 py-2 text-sm text-cream">
        </div>
        <select id="histRange" onchange="setHistoryFilter('range', this.value)" class="bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream">
          <option value="all" ${historyFilters.range==='all'?'selected':''}>All Time</option>
          <option value="today" ${historyFilters.range==='today'?'selected':''}>Today</option>
          <option value="yesterday" ${historyFilters.range==='yesterday'?'selected':''}>Yesterday</option>
          <option value="week" ${historyFilters.range==='week'?'selected':''}>This Week</option>
          <option value="month" ${historyFilters.range==='month'?'selected':''}>This Month</option>
          <option value="custom" ${historyFilters.range==='custom'?'selected':''}>Custom Date</option>
        </select>
        ${historyFilters.range==='custom' ? `
          <input type="date" value="${historyFilters.from}" onchange="setHistoryFilter('from', this.value)" class="bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream">
          <input type="date" value="${historyFilters.to}" onchange="setHistoryFilter('to', this.value)" class="bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream">
        ` : ''}
      </div>
      <div id="historyTableWrap" class="overflow-x-auto"></div>
    </div>
  `;
  renderHistoryTable();
}
function setHistoryFilter(key, val){ historyFilters[key] = val; if(key==='range' && val!=='custom'){ historyFilters.from=''; historyFilters.to=''; } if(key==='range'){ navigate('history'); } else renderHistoryTable(); }
function filteredInvoices(){
  const invoices = DB.get(K.invoices, []);
  const now = new Date();
  return invoices.filter(inv => {
    const q = historyFilters.q.toLowerCase();
    if(q && !(inv.invoiceNo.toLowerCase().includes(q) || inv.customerName.toLowerCase().includes(q) || (inv.customerPhone||'').includes(q))) return false;
    const d = new Date(inv.dateISO);
    if(historyFilters.range==='today' && !isSameDay(d, now)) return false;
    if(historyFilters.range==='yesterday'){ const y = new Date(now); y.setDate(y.getDate()-1); if(!isSameDay(d,y)) return false; }
    if(historyFilters.range==='week'){ const wk = new Date(now); wk.setDate(wk.getDate()-7); if(d < wk) return false; }
    if(historyFilters.range==='month'){ if(d.getMonth()!==now.getMonth() || d.getFullYear()!==now.getFullYear()) return false; }
    if(historyFilters.range==='custom'){
      if(historyFilters.from && d < new Date(historyFilters.from)) return false;
      if(historyFilters.to && d > new Date(historyFilters.to+'T23:59:59')) return false;
    }
    return true;
  }).sort((a,b)=> new Date(b.dateISO)-new Date(a.dateISO));
}

                  <button onclick="deleteService('${s.id}')" class="text-danger/80 hover:text-danger text-xs">Delete</button>
                </td>
              </tr>`).join('') || `<tr><td colspan="6" class="px-5 py-10 text-center text-muted text-sm">No services yet</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function openServiceModal(id){
  const s = id ? DB.get(K.services, []).find(x=>x.id===id) : null;
  openModal(`
    <div class="p-6">
      <h3 class="font-display text-xl text-cream mb-4">${s ? 'Edit Service' : 'Add Service'}</h3>
      <div class="space-y-3">
        <div><label class="block text-xs text-muted mb-1.5">Service Name</label><input id="svName" type="text" value="${escAttr(s?.name||'')}" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream"></div>
        <div><label class="block text-xs text-muted mb-1.5">Category</label>
          <select id="svCategory" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream">
            ${['Hair','Beard','Facial','Hair Color','Massage','Other'].map(c=>`<option value="${c}" ${s?.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs text-muted mb-1.5">Price (PKR)</label><input id="svPrice" type="number" min="0" value="${s?.price??''}" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream"></div>
          <div><label class="block text-xs text-muted mb-1.5">Duration (min)</label><input id="svDuration" type="number" min="0" value="${s?.duration??''}" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream"></div>
        </div>
        <div><label class="block text-xs text-muted mb-1.5">Status</label>
          <select id="svStatus" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream">
            <option value="Active" ${(!s||s.status==='Active')?'selected':''}>Active</option>
            <option value="Inactive" ${s?.status==='Inactive'?'selected':''}>Inactive</option>
          </select>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="closeModal()" class="flex-1 border border-edge2 text-muted hover:text-cream rounded-lg py-2.5 text-sm">Cancel</button>
        <button onclick="saveService(${s?`'${s.id}'`:'null'})" class="flex-1 bg-gold hover:bg-gold-light text-ink font-semibold rounded-lg py-2.5 text-sm">Save Service</button>
      </div>
    </div>`);
}
function saveService(id){
  const name = document.getElementById('svName').value.trim();
  const category = document.getElementById('svCategory').value;
  const price = Number(document.getElementById('svPrice').value)||0;
  const duration = Number(document.getElementById('svDuration').value)||0;
  const status = document.getElementById('svStatus').value;
  if(!name){ showToast('Service name is required', 'danger'); return; }
  const services = DB.get(K.services, []);
  if(id){ const s = services.find(x=>x.id===id); Object.assign(s, {name,category,price,duration,status}); }
  else services.push({id:uid('s'), name, category, price, duration, status});
  DB.set(K.services, services);
  closeModal(); showToast('Service saved', 'success'); navigate('services');
}
function deleteService(id){
  if(!confirm('Delete this service?')) return;
  DB.set(K.services, DB.get(K.services, []).filter(s=>s.id!==id));
  showToast('Service deleted', 'success'); navigate('services');
}

/* =========================================================
   REPORTS
   ========================================================= */
function renderReports(main){
  const invoices = DB.get(K.invoices, []).filter(i=>i.status==='Paid');
  const customers = DB.get(K.customers, []);
  const now = new Date();
  const todayRev = invoices.filter(i=>isSameDay(i.dateISO, now)).reduce((a,i)=>a+i.total,0);
  const weekStart = new Date(now); weekStart.setDate(weekStart.getDate()-7);
  const weekRev = invoices.filter(i=> new Date(i.dateISO) >= weekStart).reduce((a,i)=>a+i.total,0);
  const monthRev = invoices.filter(i=>{ const d=new Date(i.dateISO); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); }).reduce((a,i)=>a+i.total,0);

  // last 7 days sales
  const days = [...Array(7)].map((_,idx)=>{ const d=new Date(now); d.setDate(d.getDate()-(6-idx)); return d; });
  const daySales = days.map(d => invoices.filter(i=>isSameDay(i.dateISO,d)).reduce((a,i)=>a+i.total,0));
  const maxDay = Math.max(...daySales, 1);

  // last 6 months
  const months = [...Array(6)].map((_,idx)=>{ const d=new Date(now.getFullYear(), now.getMonth()-(5-idx), 1); return d; });
  const monthSales = months.map(m => invoices.filter(i=>{ const d=new Date(i.dateISO); return d.getMonth()===m.getMonth() && d.getFullYear()===m.getFullYear(); }).reduce((a,i)=>a+i.total,0));
  const maxMonth = Math.max(...monthSales, 1);

  const svcCounts = {};
  invoices.forEach(inv => inv.items.forEach(it => { svcCounts[it.name] = (svcCounts[it.name]||0) + it.qty; }));
  const popular = Object.entries(svcCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxSvc = popular.length ? popular[0][1] : 1;

  const payCounts = {Cash:0, Card:0, 'Bank Transfer':0, Other:0};
  invoices.forEach(i => { payCounts[i.paymentMethod] = (payCounts[i.paymentMethod]||0) + i.total; });
  const totalPay = Object.values(payCounts).reduce((a,b)=>a+b,0) || 1;

  main.innerHTML = `
    <div class="flex justify-between items-center mb-5 flex-wrap gap-3">
      <p class="text-muted text-sm">Overview of sales performance</p>
      <div class="flex gap-2">
        <button onclick="window.print()" class="inline-flex items-center gap-2 border border-edge2 text-cream hover:border-gold/40 rounded-lg px-3.5 py-2 text-xs"><i data-lucide="printer" class="w-4 h-4"></i> Print Report</button>
        <button onclick="downloadReport()" class="inline-flex items-center gap-2 border border-edge2 text-cream hover:border-gold/40 rounded-lg px-3.5 py-2 text-xs"><i data-lucide="download" class="w-4 h-4"></i> Download Report</button>
      </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard("Today's Revenue", fmt(todayRev), 'wallet', 'gold')}
      ${statCard('Weekly Revenue', fmt(weekRev), 'trending-up', 'info')}
      ${statCard('Monthly Revenue', fmt(monthRev), 'calendar', 'success')}
      ${statCard('Total Customers', String(customers.length), 'users', 'danger')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
      <div class="bg-surface border border-edge rounded-2xl p-5">
        <h4 class="font-display text-lg text-cream mb-5">Daily Sales <span class="text-xs text-muted font-sans">(last 7 days)</span></h4>
        <div class="flex items-end gap-3 h-40">
          ${days.map((d,idx)=>`
            <div class="flex-1 flex flex-col items-center gap-2">
              <span class="text-[10px] text-muted">${daySales[idx]?fmt(daySales[idx]).replace('PKR ',''):''}</span>
              <div class="w-full bg-surface3 rounded-t-md flex items-end" style="height:100px;">
                <div class="w-full bg-gold rounded-t-md" style="height:${Math.max(Math.round(daySales[idx]/maxDay*100),2)}%"></div>
              </div>
              <span class="text-[10px] text-muted">${d.toLocaleDateString('en-US',{weekday:'short'})}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="bg-surface border border-edge rounded-2xl p-5">
        <h4 class="font-display text-lg text-cream mb-5">Monthly Sales <span class="text-xs text-muted font-sans">(last 6 months)</span></h4>
        <div class="flex items-end gap-3 h-40">
          ${months.map((m,idx)=>`
            <div class="flex-1 flex flex-col items-center gap-2">
              <span class="text-[10px] text-muted">${monthSales[idx]?fmt(monthSales[idx]).replace('PKR ',''):''}</span>
              <div class="w-full bg-surface3 rounded-t-md flex items-end" style="height:100px;">
                <div class="w-full bg-info rounded-t-md" style="height:${Math.max(Math.round(monthSales[idx]/maxMonth*100),2)}%"></div>
              </div>
              <span class="text-[10px] text-muted">${m.toLocaleDateString('en-US',{month:'short'})}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="bg-surface border border-edge rounded-2xl p-5">
        <h4 class="font-display text-lg text-cream mb-4">Popular Services</h4>
        <div class="space-y-4">
          ${popular.map(([name,count]) => `
            <div>
              <div class="flex justify-between text-sm mb-1.5"><span class="text-cream/90">${name}</span><span class="text-muted">${count}x</span></div>
              <div class="h-1.5 bg-surface3 rounded-full overflow-hidden"><div class="h-full bg-gold rounded-full" style="width:${Math.round(count/maxSvc*100)}%"></div></div>
            </div>`).join('') || `<p class="text-muted text-sm">No data yet</p>`}
        </div>
      </div>
      <div class="bg-surface border border-edge rounded-2xl p-5">
        <h4 class="font-display text-lg text-cream mb-4">Payment Methods</h4>
        <div class="space-y-4">
          ${Object.entries(payCounts).map(([m,amt]) => `
            <div>
              <div class="flex justify-between text-sm mb-1.5"><span class="text-cream/90">${m}</span><span class="text-muted">${fmt(amt)}</span></div>
              <div class="h-1.5 bg-surface3 rounded-full overflow-hidden"><div class="h-full bg-info rounded-full" style="width:${Math.round(amt/totalPay*100)}%"></div></div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;
}
function downloadReport(){
  const invoices = DB.get(K.invoices, []).filter(i=>i.status==='Paid');
  const total = invoices.reduce((a,i)=>a+i.total,0);
  let out = 'ZAIN SALOON — SALES REPORT\n' + '='.repeat(32) + '\n';
  out += `Generated: ${fmtDate(new Date())} ${fmtTime(new Date())}\n\n`;
  out += `Total Paid Invoices: ${invoices.length}\nTotal Revenue: ${fmt(total)}\n\n`;
  out += 'INVOICES\n' + '-'.repeat(32) + '\n';
  invoices.forEach(i => { out += `${i.invoiceNo}  ${fmtDate(i.dateISO)}  ${i.customerName}  ${fmt(i.total)}\n`; });
  const blob = new Blob([out], {type:'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'zain-saloon-report.txt'; a.click();
  showToast('Report downloaded', 'success');
}

/* =========================================================
   SETTINGS
   ========================================================= */
function renderSettings(main){
  const s = DB.get(K.settings, {});
  main.innerHTML = `
    <div class="max-w-2xl space-y-5">
      <div class="bg-surface border border-edge rounded-2xl p-5">
        <h4 class="font-display text-lg text-cream mb-4">Salon Information</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div><label class="block text-xs text-muted mb-1.5">Salon Name</label><input id="stName" type="text" value="${escAttr(s.salonName)}" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream"></div>
          <div><label class="block text-xs text-muted mb-1.5">Phone</label><input id="stPhone" type="text" value="${escAttr(s.phone)}" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream"></div>
          <div class="sm:col-span-2"><label class="block text-xs text-muted mb-1.5">Address</label><input id="stAddress" type="text" value="${escAttr(s.address)}" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream"></div>
          <div><label class="block text-xs text-muted mb-1.5">Currency</label><input id="stCurrency" type="text" value="${escAttr(s.currency)}" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream"></div>
        </div>
      </div>

      <div class="bg-surface border border-edge rounded-2xl p-5">
        <h4 class="font-display text-lg text-cream mb-4">Billing Settings</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div><label class="block text-xs text-muted mb-1.5">Tax %</label><input id="stTax" type="number" min="0" value="${s.taxPercent}" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream"></div>
          <div><label class="block text-xs text-muted mb-1.5">Default Discount (PKR)</label><input id="stDiscount" type="number" min="0" value="${s.defaultDiscount}" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream"></div>
        </div>
      </div>

      <div class="bg-surface border border-edge rounded-2xl p-5">
        <h4 class="font-display text-lg text-cream mb-4">Receipt Settings</h4>
        <div class="space-y-2.5 mb-4">
          <label class="flex items-center gap-2.5"><input id="stLogo" type="checkbox" ${s.showLogo?'checked':''} class="w-4 h-4 accent-[#C79A3E]"><span class="text-sm text-cream/90">Show Logo</span></label>
          <label class="flex items-center gap-2.5"><input id="stShowPhone" type="checkbox" ${s.showPhone?'checked':''} class="w-4 h-4 accent-[#C79A3E]"><span class="text-sm text-cream/90">Show Customer Phone</span></label>
          <label class="flex items-center gap-2.5"><input id="stShowAddress" type="checkbox" ${s.showAddress?'checked':''} class="w-4 h-4 accent-[#C79A3E]"><span class="text-sm text-cream/90">Show Address</span></label>
        </div>
        <label class="block text-xs text-muted mb-1.5">Footer Message</label>
        <textarea id="stFooter" rows="2" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2 text-sm text-cream">${escHtml(s.footerMessage||'')}</textarea>
      </div>

      <button onclick="saveSettings()" class="w-full bg-gold hover:bg-gold-light text-ink font-semibold rounded-lg py-3 text-sm">Save Settings</button>
    </div>
  `;
}
function saveSettings(){
  const s = {
    salonName: document.getElementById('stName').value.trim(),
    phone: document.getElementById('stPhone').value.trim(),
    address: document.getElementById('stAddress').value.trim(),
    currency: document.getElementById('stCurrency').value.trim() || 'PKR',
    taxPercent: Number(document.getElementById('stTax').value)||0,
    defaultDiscount: Number(document.getElementById('stDiscount').value)||0,
    showLogo: document.getElementById('stLogo').checked,
    showPhone: document.getElementById('stShowPhone').checked,
    showAddress: document.getElementById('stShowAddress').checked,
    footerMessage: document.getElementById('stFooter').value
  };
  DB.set(K.settings, s);
  showToast('Settings saved', 'success');
}

/* ---------- Utility: escaping ---------- */
function escHtml(str){ return String(str??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(str){ return escHtml(str); }

</script>
